# Validate the inherited landing page. Deployment is inactive in this fork.
#
# This is the only workflow a landing-only change runs. ci.yml (iOS) and
# ci-node.yml (plugin / relay / codegen) use positive path filters that do
# not include landing/**, so a copy edit never spends a macOS runner.
#
# Pull requests build and typecheck. No main push or deploy job is configured.

name: Landing

on:
  pull_request:
    paths:
      - landing/**
      - .github/workflows/landing.yml

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
